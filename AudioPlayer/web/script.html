<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><style>
html{background:#F8F8F6;color:#283747;font:18px/1.7 Georgia,"Segoe UI",serif;scroll-behavior:auto;overflow-anchor:none}
body{margin:16px;overflow-wrap:break-word}h1{font-size:1.2em;text-align:center}p{margin:0 0 var(--paragraph-after,16px);text-indent:var(--indent,0em);position:relative}
#status{color:#687783;font:14px "Segoe UI",sans-serif}
.paint{position:absolute;inset:0;color:var(--playback-color,#B64550);pointer-events:none;user-select:none}
.clips{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
</style></head><body><div id="status"></div><h1 id="title" hidden></h1><main id="text"></main><script>
"use strict";
const title=document.getElementById('title'), body=document.getElementById('text'), status=document.getElementById('status');
const ns='http://www.w3.org/2000/svg';
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const progress=(t,start,end)=>clamp((t-start)/(end-start),0,1);
const scrollTarget=(y,height,total)=>clamp(y-height/2,0,Math.max(0,total-height));
const cosine=u=>(1-Math.cos(Math.PI*clamp(u,0,1)))/2;
let geometry=[],lines=[],playback={position:0,playing:false,reset:true},activeLine=null;
let animation=0,measureFrame=0,lastTarget=null,previousPosition=null;
let epoch=0,manual=false,pending=null;
function cancelManual(){manual=false;pending=null;cancelAnimation();}
function preview(line){
  if(!line || line.first===null)return;
  manual=true;pending=line.first;cancelAnimation();
  update({position:pending,playing:false,reset:false},false,true);
  chrome.webview.postMessage({type:'preview',epoch,position:pending});
}
function nearest(y){
  return lines.reduce((best,line)=>!best||Math.abs(line.y-y)<Math.abs(best.y-y)?line:best,null);
}
function wheelLine(){
  const max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  if(window.scrollY<0.5)return lines.find(l=>l.first!==null);
  if(window.scrollY>=max-0.5)return lines.findLast(l=>l.first!==null);
  return nearest(window.scrollY+window.innerHeight/2);
}
window.addEventListener('wheel',event=>{
  event.preventDefault();
  cancelAnimation();
  const before=window.scrollY;
  const delta=event.deltaY*(event.deltaMode===1?parseFloat(getComputedStyle(document.documentElement).lineHeight):event.deltaMode===2?window.innerHeight:1);
  window.scrollTo(0,before+delta);
  if(Math.abs(window.scrollY-before)<0.01)return;
  const line=wheelLine();
  if(line?.first!==null && line?.first!==undefined)preview(line);
  else if(manual && pending!==null)chrome.webview.postMessage({type:'preview',epoch,position:pending});
},{passive:false});
body.addEventListener('dblclick',event=>{
  const line=nearest(event.clientY+window.scrollY);
  if(line && line.first!==null)preview(line);
});
window.addEventListener('keydown',event=>{
  if(event.altKey||event.metaKey||event.shiftKey||
     !(['ArrowLeft','ArrowRight'].includes(event.key)||(event.key===' '&&!event.ctrlKey)))return;
  event.preventDefault();
  if(!event.repeat)chrome.webview.postMessage({type:'shortcut',epoch,key:event.key,control:event.ctrlKey});
});
window.addEventListener('auxclick',event=>{if(event.button===1)event.preventDefault();});
window.addEventListener('mousedown',event=>{if(event.button===1)event.preventDefault();});
function cancelAnimation(){if(animation)cancelAnimationFrame(animation);animation=0;lastTarget=null;}
function moveTo(target,immediate){
  if(immediate){cancelAnimation();window.scrollTo(0,target);return;}
  if(lastTarget===target && animation)return;
  if(Math.abs(window.scrollY-target)<0.5){cancelAnimation();return;}
  cancelAnimation();lastTarget=target;
  const from=window.scrollY,begin=performance.now();
  function step(now){
    const u=clamp((now-begin)/50,0,1);
    window.scrollTo(0,from+(target-from)*cosine(u));
    if(u<1)animation=requestAnimationFrame(step);else{animation=0;lastTarget=null;}
  }
  animation=requestAnimationFrame(step);
}
function render(data){
  cancelManual();epoch=data.epoch;geometry=[];lines=[];activeLine=null;previousPosition=null;
  playback={position:0,playing:false,reset:true};
  title.textContent=data.article?.title??'';title.hidden=!title.textContent;
  status.textContent=data.message??'';body.replaceChildren();window.scrollTo(0,0);
  for(const [pi,paragraph] of (data.article?.paragraphs??[]).entries()){
    const p=document.createElement('p');
    for(const [i,sentence] of paragraph.sentences.entries()){
      const raw=sentence.text;
      if(i && !/\s$/u.test(paragraph.sentences[i-1].text) && !/^\s/u.test(raw))p.append(' ');
      const span=document.createElement('span');span.className='sentence';
      let cursor=0;
      for(const unit of sentence.timedUnits){
        if(!unit.canColor || unit.offset<cursor || unit.length<=0 ||
          raw.slice(unit.offset,unit.offset+unit.length)!==unit.text)continue;
        span.append(raw.slice(cursor,unit.offset));
        const timed=document.createElement('span');timed.className='timed';
        timed.textContent=unit.text;timed.dataset.start=unit.start;timed.dataset.end=unit.end;
        span.append(timed);cursor=unit.offset+unit.length;
      }
      span.append(raw.slice(cursor));p.append(span);
    }
    const paint=document.createElement('span');paint.className='paint';paint.setAttribute('aria-hidden','true');
    for(const child of [...p.childNodes])paint.append(child.cloneNode(true));
    const svg=document.createElementNS(ns,'svg');svg.setAttribute('class','clips');svg.setAttribute('aria-hidden','true');
    const clip=document.createElementNS(ns,'clipPath');clip.id='clip-'+pi;clip.setAttribute('clipPathUnits','userSpaceOnUse');
    svg.append(clip);paint.style.clipPath='url(#'+clip.id+')';
    p.append(paint,svg);body.append(p);
  }
  scheduleMeasure();
}
function scheduleMeasure(){
  if(!measureFrame)measureFrame=requestAnimationFrame(()=>{measureFrame=0;measure();});
}
function measure(){
  cancelAnimation();geometry=[];lines=[];activeLine=null;
  const y=window.scrollY;
  const byY=new Map();
  function lineFor(rect){
    const cy=rect.top+y+rect.height/2,key=Math.round(cy);
    let line;
    for(let k=key-2;k<=key+2;k++){
      const candidate=byY.get(k);
      if(candidate && Math.abs(candidate.y-cy)<2){line=candidate;break;}
    }
    if(!line){line={y:cy,first:null};lines.push(line);byY.set(key,line);}
    return line;
  }
  for(const p of body.querySelectorAll('p')){
    const paint=p.querySelector(':scope > .paint'),clip=p.querySelector('clipPath');
    clip.replaceChildren();const base=paint.getBoundingClientRect();
    // Measure untimed text too, including lines containing no timed units.
    for(const sentence of p.querySelectorAll(':scope > .sentence')){
      const range=document.createRange();range.selectNodeContents(sentence);
      for(const rect of range.getClientRects())if(rect.width>0.25&&rect.height>0.25)lineFor(rect);
    }
    for(const span of p.querySelectorAll(':scope > .sentence .timed')){
      const start=Number(span.dataset.start),end=Number(span.dataset.end);
      const range=document.createRange();range.selectNodeContents(span);
      const rects=[...range.getClientRects()].filter(r=>r.width>0.25&&r.height>0.25).sort((a,b)=>a.top-b.top||a.left-b.left);
      const segments=rects.map(r=>{
        const line=lineFor(r);if(line.first===null)line.first=start;
        const element=document.createElementNS(ns,'rect');
        element.setAttribute('x',r.left-base.left);element.setAttribute('y',r.top-base.top-1);
        element.setAttribute('width','0');element.setAttribute('height',r.height+2);clip.append(element);
        return {element,width:r.width,line,painted:0};
      });
      if(segments.length)geometry.push({start,end,segments,total:segments.reduce((sum,s)=>sum+s.width,0),last:NaN});
    }
  }
  lines.sort((a,b)=>a.y-b.y);
  update(playback,true,manual);
}
function update(state,immediate=false,previewOnly=false){
  if(manual && !previewOnly)return;
  if(!state.playing && animation)cancelAnimation();
  playback=state;
  const t=state.position;
  let current=null,latest=-Infinity;
  for(const unit of geometry){
    const fraction=state.reset?0:progress(t,unit.start,unit.end);
    if(unit.last!==fraction){
      unit.last=fraction;let remaining=fraction*unit.total;
      for(const seg of unit.segments){
        const width=clamp(remaining,0,seg.width);
        if(width!==seg.painted){seg.element.setAttribute('width',width);seg.painted=width;}
        remaining-=seg.width;
      }
    }
    // Retain the preceding line through timestamp gaps; a wrapped unit
    // follows the fragment reached by its cumulative painted width.
    if(!state.reset && t>=unit.start && unit.start>=latest){
      latest=unit.start;let remaining=fraction*unit.total;
      current=unit.segments.at(-1).line;
      for(const seg of unit.segments){
        if(remaining<seg.width){current=seg.line;break;}remaining-=seg.width;
      }
    }
  }
  const jumped=previousPosition!==null && (t<previousPosition || t-previousPosition>0.35);
  previousPosition=t;
  if(previewOnly){activeLine=current;return;}
  if(state.reset){activeLine=null;moveTo(0,true);return;}
  if(!current)return;
  if(current!==activeLine || immediate || jumped){
    activeLine=current;
    moveTo(scrollTarget(current.y,window.innerHeight,document.documentElement.scrollHeight),immediate||jumped||!state.playing);
  }
}
chrome.webview.addEventListener('message',({data})=>{
  if(data.type==='appearance'){
    const a=data.appearance,root=document.documentElement.style;
    root.fontFamily=a.font+', "Segoe UI", serif';
    root.fontSize=a.fontSize+'px';root.lineHeight=String(a.lineHeight);
    root.color=a.color;root.backgroundColor=a.background;
    root.setProperty('--paragraph-after',a.paragraphAfter+'px');
    root.setProperty('--indent',a.firstLineIndent+'em');
    root.setProperty('--playback-color',a.scriptColor);
    scheduleMeasure();
  }
  else if(data.type==='article')render(data);
  else if(data.type==='playback' && data.epoch===epoch)update(data,data.immediate===true);
  else if(data.type==='cancel'){epoch=data.epoch;cancelManual();activeLine=null;previousPosition=null;}
  else if(data.type==='commit'){
    epoch=data.epoch;manual=false;pending=null;
    update(data,false,true); // Preserve manual offset until the next visual line.
  }
});
window.addEventListener('resize',scheduleMeasure);
document.fonts.ready.then(scheduleMeasure);
chrome.webview.postMessage('ready');
</script></body></html>
