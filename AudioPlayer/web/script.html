<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><style>
html{background:#F8F8F6;color:#283747;font:18px/1.7 Georgia,"Segoe UI",serif;scroll-behavior:auto;overflow-anchor:none}
body{margin:16px;overflow-wrap:break-word}h1{font-size:1.2em;text-align:center}p{margin:0 0 var(--paragraph-after,16px);text-indent:var(--indent,0em);position:relative;isolation:isolate}
#status{color:#687783;font:14px "Segoe UI",sans-serif}
.paint{position:absolute;inset:0;width:100%;height:100%;z-index:-1;fill:var(--playback-color,#F6EDC2);pointer-events:none;overflow:visible;shape-rendering:crispEdges}
</style></head><body><div id="status"></div><h1 id="title" hidden></h1><main id="text"></main><script>
"use strict";
const title=document.getElementById('title'), body=document.getElementById('text'), status=document.getElementById('status');
const ns='http://www.w3.org/2000/svg';
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const progress=(t,start,end)=>clamp((t-start)/(end-start),0,1);
const scrollTarget=(y,height,total)=>clamp(y-height/2,0,Math.max(0,total-height));
// The host samples the audio clock about every 25 ms while playing.
const MAX_CLOCK_EXTRAPOLATION_S=0.05;
const FOLLOW_HANDOFF_MS=150;
let geometry=[],followAnchors=[],playback={position:0,playing:false,reset:true};
let animation=0,measureFrame=0;
let sampleAt=0,followTime=null,handoffOffset=0,handoffAt=0;
let epoch=0,pending=null;
let knownScrollY=window.scrollY,knownScrollLimit=null;
let started=0,paintPosition=null;
const activeUnits=new Set();
function cancelManual(){pending=null;cancelAnimation();}
function preview(time){
  pending=time;cancelAnimation();
  paintAt(time,false);
  chrome.webview.postMessage({type:'preview',epoch,position:time});
}
// Keep the actual browser offset, not the requested fractional position:
// Chromium may round or clamp scrollTo. Its later scroll event is not a seek.
function scrollLimit(){return Math.max(0,document.documentElement.scrollHeight-window.innerHeight);}
function rememberScroll(){knownScrollY=window.scrollY;knownScrollLimit=scrollLimit();}
function scrollProgrammatically(y){window.scrollTo(0,y);rememberScroll();}
function previewScroll(){
  const time=timeAtOffset(window.scrollY);
  if(time===null)return false;
  preview(time);
  return true;
}
function detectExternalScroll(){
  const changed=Math.abs(window.scrollY-knownScrollY)>0.01;
  const layoutChanged=knownScrollLimit!==null && knownScrollLimit!==scrollLimit();
  rememberScroll();
  if(!changed || layoutChanged || measureFrame)return false;
  return previewScroll();
}
window.addEventListener('scroll',detectExternalScroll,{passive:true});
window.addEventListener('keydown',event=>{
  if(event.altKey||event.metaKey||event.shiftKey||
     !(['ArrowLeft','ArrowRight'].includes(event.key)||(event.key===' '&&!event.ctrlKey)))return;
  event.preventDefault();
  if(!event.repeat)chrome.webview.postMessage({type:'shortcut',epoch,key:event.key,control:event.ctrlKey});
});
window.addEventListener('auxclick',event=>{if(event.button===1)event.preventDefault();});
window.addEventListener('mousedown',event=>{if(event.button===1)event.preventDefault();});
function cancelAnimation(){
  if(animation)cancelAnimationFrame(animation);
  animation=0;followTime=null;handoffOffset=0;
}
// A strictly increasing time axis in document order prevents backward motion
// from overlapping, equal or out-of-order line timestamps.
function buildFollowAnchors(visualLines){
  const anchors=[];
  for(const line of visualLines){
    const time=line.followStart;
    if(Number.isFinite(time) && (!anchors.length || time>anchors.at(-1).time))
      anchors.push({time,y:line.y});
  }
  return anchors;
}
// One monotone trajectory, evaluated in either direction. Both playback and
// manual navigation use exactly the same measured anchors.
function interpolate(value,input,output){
  let lo=0,hi=followAnchors.length-1;
  if(value<=followAnchors[lo][input])return followAnchors[lo][output];
  if(value>=followAnchors[hi][input])return followAnchors[hi][output];
  while(hi-lo>1){
    const mid=(lo+hi)>>>1;
    if(followAnchors[mid][input]<=value)lo=mid;else hi=mid;
  }
  const a=followAnchors[lo],b=followAnchors[hi];
  const u=(value-a[input])/(b[input]-a[input]);
  return a[output]+(b[output]-a[output])*u;
}
function followOffset(t,height=window.innerHeight,total=document.documentElement.scrollHeight){
  if(!followAnchors.length)return 0;
  const first=followAnchors[0];
  if(t<first.time){
    return scrollTarget(first.y,height,total)*clamp(t/first.time,0,1);
  }
  return scrollTarget(interpolate(t,'time','y'),height,total);
}
function timeAtOffset(offset,height=window.innerHeight,total=document.documentElement.scrollHeight){
  const limit=Math.max(0,total-height);
  if(!followAnchors.length || limit<=0)return null;
  const first=followAnchors[0],last=followAnchors.at(-1);
  // At the natural scroll limits several times map to the same position;
  // retain the first/last timed line as the unambiguous manual target.
  if(offset<=0.5)return first.time;
  if(offset>=limit-0.5)return last.time;
  const firstOffset=scrollTarget(first.y,height,total);
  if(offset<firstOffset)return first.time*offset/firstOffset;
  return interpolate(offset+height/2,'y','time');
}
function followFrame(now){
  if(pending!==null || !playback.playing || playback.reset){cancelAnimation();return;}
  if(detectExternalScroll())return;
  // Interpolate the clock between host samples, never run freely beyond a
  // short bound if updates stall. Coloring still uses confirmed audio time.
  const estimate=playback.position+clamp((now-sampleAt)/1000,0,MAX_CLOCK_EXTRAPOLATION_S);
  followTime=Math.max(followTime??playback.position,estimate);
  const bias=handoffOffset*(1-clamp((now-handoffAt)/FOLLOW_HANDOFF_MS,0,1));
  const target=clamp(followOffset(followTime)+bias,0,
    Math.max(0,document.documentElement.scrollHeight-window.innerHeight));
  if(Math.abs(target-window.scrollY)>=0.5)scrollProgrammatically(target);
  animation=requestAnimationFrame(followFrame);
}
function followPlayback(t,immediate){
  if(immediate){
    cancelAnimation();
    scrollProgrammatically(followOffset(t));
  }
  if(!followAnchors.length)return;
  if(!animation){
    followTime=t;
    handoffAt=sampleAt;
    handoffOffset=immediate?0:window.scrollY-followOffset(t);
    animation=requestAnimationFrame(followFrame);
  }
}
function render(data){
  cancelManual();epoch=data.epoch;geometry=[];followAnchors=[];
  started=0;paintPosition=null;activeUnits.clear();
  playback={position:0,playing:false,reset:true};
  title.textContent=data.article?.title??'';title.hidden=!title.textContent;
  status.textContent=data.message??'';body.replaceChildren();scrollProgrammatically(0);
  for(const paragraph of data.article?.paragraphs??[]){
    const p=document.createElement('p');
    for(const [i,sentence] of paragraph.sentences.entries()){
      const raw=sentence.text;
      if(i && !/\s$/u.test(paragraph.sentences[i-1].text) && !/^\s/u.test(raw))p.append(' ');
      const span=document.createElement('span');span.className='sentence';
      let cursor=0;
      for(const unit of sentence.timedUnits){
        if(!unit.canColor || unit.offset<cursor || unit.length<=0 ||
          raw.slice(unit.offset,unit.offset+unit.length)!==unit.text)continue;
        span.append(raw.slice(cursor,unit.offset));
        const timed=document.createElement('span');timed.className='timed';
        timed.textContent=unit.text;timed.dataset.start=unit.start;timed.dataset.end=unit.end;
        span.append(timed);cursor=unit.offset+unit.length;
      }
      span.append(raw.slice(cursor));p.append(span);
    }
    const paint=document.createElementNS(ns,'svg');paint.setAttribute('class','paint');paint.setAttribute('aria-hidden','true');
    p.append(paint);body.append(p);
  }
  scheduleMeasure();
}
function scheduleMeasure(){
  if(!measureFrame)measureFrame=requestAnimationFrame(()=>{measureFrame=0;measure();});
}
function measure(){
  rememberScroll();cancelAnimation();geometry=[];followAnchors=[];
  const lines=[];
  started=0;paintPosition=null;activeUnits.clear();
  const y=window.scrollY;
  const byY=new Map();
  function lineFor(rect){
    const cy=rect.top+y+rect.height/2,key=Math.round(cy);
    let line;
    for(let k=key-2;k<=key+2;k++){
      const candidate=byY.get(k);
      if(candidate && Math.abs(candidate.y-cy)<2){line=candidate;break;}
    }
    if(!line){line={y:cy,followStart:null};lines.push(line);byY.set(key,line);}
    return line;
  }
  for(const p of body.querySelectorAll('p')){
    const paint=p.querySelector(':scope > .paint');
    paint.replaceChildren();const base=paint.getBoundingClientRect();
    let previous=null;
    for(const span of p.querySelectorAll(':scope > .sentence .timed')){
      const start=Number(span.dataset.start),end=Number(span.dataset.end);
      const range=document.createRange();range.selectNodeContents(span);
      const rects=[...range.getClientRects()].filter(r=>r.width>0.25&&r.height>0.25).sort((a,b)=>a.top-b.top||a.left-b.left);
      if(!rects.length){previous=null;continue;}
      // Join only whitespace between adjacent timed units on the same visual line.
      if(previous && Math.abs(previous.rect.top-rects[0].top)<2){
        const gap=rects[0].left-previous.rect.right;
        if(gap>0){
          range.setStartAfter(previous.span);range.setEndBefore(span);
          if(/^\s+$/u.test(range.toString()))previous.segment.trailingGap=gap;
        }
      }
      const total=rects.reduce((sum,r)=>sum+r.width,0);
      let consumed=0;
      const segments=rects.map(r=>{
        const line=lineFor(r);
        // A wrapped word contributes a proportional time to each visual line.
        const time=start+(end-start)*consumed/total;
        line.followStart=line.followStart===null?time:Math.min(line.followStart,time);
        consumed+=r.width;
        const element=document.createElementNS(ns,'rect');
        element.setAttribute('x',r.left-base.left);element.setAttribute('y',r.top-base.top-1);
        element.setAttribute('width','0');element.setAttribute('height',r.height+2);paint.append(element);
        return {element,width:r.width,trailingGap:0,painted:0};
      });
      geometry.push({start,end,segments,total,last:NaN});
      previous={span,rect:rects.at(-1),segment:segments.at(-1)};
    }
  }
  lines.sort((a,b)=>a.y-b.y);
  followAnchors=buildFollowAnchors(lines);
  // Stable sort preserves original document order for equal starts.
  geometry.sort((a,b)=>a.start-b.start);
  if(pending!==null)paintAt(pending,false);
  else update(playback,true);
}
function paintUnit(unit,fraction){
  if(unit.last===fraction)return;
  unit.last=fraction;let remaining=fraction*unit.total;
  for(const seg of unit.segments){
    const width=clamp(remaining,0,seg.width)+(fraction===1?seg.trailingGap:0);
    if(width!==seg.painted){seg.element.setAttribute('width',width);seg.painted=width;}
    remaining-=seg.width;
  }
}
// Coloring is a pure projection of a requested time (preview or host clock).
// Previewing must never overwrite the authoritative playback snapshot.
function paintAt(t,reset){
  if(reset || (paintPosition!==null && t<paintPosition)){
    for(let i=0;i<started;i++)paintUnit(geometry[i],0);
    started=0;activeUnits.clear();
  }
  if(!reset){
    while(started<geometry.length && geometry[started].start<=t)
      activeUnits.add(geometry[started++]);
    for(const unit of activeUnits){
      paintUnit(unit,progress(t,unit.start,unit.end));
      if(t>=unit.end)activeUnits.delete(unit);
    }
  }
  paintPosition=reset?null:t;
}
function update(state,immediate=false,preserveOffset=false){
  const prior=playback.position,wasPlaying=playback.playing;
  const t=state.position;
  playback=state;
  if(t!==prior || !wasPlaying || immediate || preserveOffset)sampleAt=performance.now();
  paintAt(t,state.reset);
  if(state.reset){cancelAnimation();scrollProgrammatically(0);return;}
  const jumped=t<prior || t-prior>0.35;
  if(preserveOffset){
    // Successful manual seek: keep the actual offset until follow resumes,
    // and use the existing handoff to avoid a visible snap.
    cancelAnimation();
    if(state.playing)followPlayback(t,false);
    return;
  }
  if(state.playing){followPlayback(t,immediate||jumped);return;}
  cancelAnimation();
  if(immediate||jumped||(!wasPlaying && t!==prior))
    scrollProgrammatically(followOffset(t));
}
function receivePlayback(data){
  if(data.epoch<epoch)return;
  if(data.epoch===epoch){
    // Samples already queued before the host received the preview cannot
    // overwrite it. Every command completion uses a newer epoch.
    if(pending===null)update(data);
    return;
  }
  const preserveOffset=pending!==null && data.committedTarget===pending && !data.reset;
  cancelManual();
  epoch=data.epoch;
  update(data,!preserveOffset,preserveOffset);
}
chrome.webview.addEventListener('message',({data})=>{
  if(data.type==='appearance'){
    const a=data.appearance,root=document.documentElement.style;
    root.fontFamily=a.font+', "Segoe UI", serif';
    root.fontSize=a.fontSize+'px';root.lineHeight=String(a.lineHeight);
    root.color=a.color;root.backgroundColor=a.background;
    root.setProperty('--paragraph-after',a.paragraphAfter+'px');
    root.setProperty('--indent',a.firstLineIndent+'em');
    root.setProperty('--playback-color',a.scriptColor);
    scheduleMeasure();
  }
  else if(data.type==='article' && data.epoch>=epoch)render(data);
  else if(data.type==='playback')receivePlayback(data);
});
window.addEventListener('resize',scheduleMeasure);
document.fonts.ready.then(scheduleMeasure);
chrome.webview.postMessage('ready');
</script></body></html>
